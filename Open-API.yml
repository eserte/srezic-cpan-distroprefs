---
match:
  distribution: 'LNATION/Open-API-\d+'
disabled: 1
# takes much time if some prereqs are met (Hyperman installed?), killing processes, crashing machine
# https://rt.cpan.org/Ticket/Display.html?id=180951
---
match:
  distribution: '/Open-API-0\.\d'
test:
  commandline: 'ulimit -v 1048576; make test'
# Memory problems seen on debian12+13, ubuntu24.04 and problematic behavior on fedora43
# Versions 0.09 + 0.10 are completely disabled.
# XXX Did not help, rule is not used anymore.
